name: Mirror to GitVerse

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        continue-on-error: true
        env:
          GITVERSE_USER: ${{ secrets.GITVERSE_USER }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git remote add gitverse "https://${GITVERSE_USER}:${GITVERSE_TOKEN}@gitverse.ru/bylka2W/Test.git" 2>/dev/null || true
          git remote set-url gitverse "https://${GITVERSE_USER}:${GITVERSE_TOKEN}@gitverse.ru/bylka2W/Test.git"
          git push gitverse main --force
          git push gitverse --tags
