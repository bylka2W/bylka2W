name: Mirror to GitVerse and GitFlic

on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        run: |
          git remote remove gitverse || true
          git remote add gitverse https://${{ secrets.GITVERSE_USER }}:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/bylka2W/bylka2W.git
          git push gitverse main --force

      - name: Push to GitFlic
        run: |
          git remote remove gitflic || true
          git remote add gitflic https://${{ secrets.GITFLIC_USER }}:${{ secrets.GITFLIC_TOKEN }}@gitflic.ru/bylka2W/bylka2W.git
          git push gitflic main --force